<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel domiciliar</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f0;font:15px Arial;color:#171717}header{background:#171717;color:white;padding:20px}main{max-width:1200px;margin:auto;padding:20px}.card{background:white;border:1px solid #e5e0d6;border-radius:14px;padding:18px;margin:14px 0}.hidden{display:none!important}input,select{padding:11px;border:1px solid #d5d0c6;border-radius:8px;font:inherit}.btn{border:0;border-radius:8px;padding:10px 13px;background:#c7a66a;font-weight:bold;cursor:pointer}.light{background:#eeeae1}.red{background:#f6e0de}.row{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.row input,.row select{flex:1;min-width:170px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:white;border:1px solid #e5e0d6;border-radius:12px;padding:14px}.metric strong{display:block;font-size:24px;margin-top:8px}table{border-collapse:collapse;width:100%;min-width:920px}th,td{padding:12px;border-bottom:1px solid #e5e0d6;text-align:left;vertical-align:top;font-size:13px}th{background:#f7f5ef}.wrap{overflow:auto;border:1px solid #e5e0d6;border-radius:12px;background:white}.status{padding:10px;border-radius:8px;margin:10px 0}.err{background:#fff0f0;color:#9b2222}.ok{background:#eaf7ee;color:#216a3e}.muted{color:#716d65;font-size:12px}@media(max-width:700px){.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><header><b>BARBEARIA DOMICILIAR PREMIUM</b><div style="font-size:12px;color:#ccc;margin-top:5px">Painel administrativo</div></header><main>
<div id="login" class="card" style="max-width:420px;margin:35px auto"><h2>Entrar</h2><p class="muted"></p><p><input id="email" type="email" placeholder="E-mail" style="width:100%"></p><p><input id="password" type="password" placeholder="Senha" style="width:100%"></p><button id="loginBtn" class="btn">Entrar no painel</button><div id="loginMsg"></div></div>
<div id="app" class="hidden"><div class="row" style="justify-content:space-between"><div><h1>Agenda domiciliar</h1><p class="muted">Pedidos, horários e status de atendimento.</p></div><button id="logout" class="btn light">Sair</button></div>
<div class="metrics"><div class="metric">Pendentes<strong id="pending">0</strong></div><div class="metric">Confirmados<strong id="confirmed">0</strong></div><div class="metric">Concluídos<strong id="done">0</strong></div><div class="metric">Faturamento concluído<strong id="revenue">R$ 0</strong></div></div>
<div class="card"><div class="row"><input id="search" placeholder="Buscar nome, telefone, bairro"><select id="statusFilter"><option value="">Todos os status</option><option value="pendente">Pendente</option><option value="confirmado">Confirmado</option><option value="em_deslocamento">Em deslocamento</option><option value="concluido">Concluído</option><option value="cancelado">Cancelado</option></select><input id="dateFilter" type="date"><button id="refresh" class="btn light">Atualizar</button></div><div id="msg"></div><div class="wrap"><table><thead><tr><th>Cliente</th><th>Serviço</th><th>Data / hora</th><th>Endereço</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody id="rows"><tr><td colspan="7">Carregando...</td></tr></tbody></table></div></div></div></main>
<script>
const cfg=window.APP_CONFIG,$=id=>document.getElementById(id);const db=window.supabase&&cfg.SUPABASE_ANON_KEY&&!cfg.SUPABASE_ANON_KEY.includes("COLE_AQUI")?window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;let all=[];
function show(id,t,c){$(id).innerHTML=t;$(id).className="status "+c}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
async function check(){if(!db){show("loginMsg","Configure a chave em config.js.","err");return}const {data:{session}}=await db.auth.getSession();if(!session){$("login").classList.remove("hidden");$("app").classList.add("hidden");return}
const {data:p,error}=await db.from("usuarios2").select("id,nome,email,cargo,ativo").eq("auth_user_id",session.user.id).eq("ativo",true).maybeSingle();if(error||!p){await db.auth.signOut();$("login").classList.remove("hidden");show("loginMsg","Conta ainda não autorizada em usuarios2. Essa tabela será criada na etapa final.","err");return}
$("login").classList.add("hidden");$("app").classList.remove("hidden");await load()}
$("loginBtn").onclick=async()=>{if(!db)return;const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){show("loginMsg",esc(error.message),"err");return}await check()};
$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
async function load(){let q=db.from("agendamentos_domicilio").select("*").order("data_preferida").order("horario_preferido");if($("statusFilter").value)q=q.eq("status",$("statusFilter").value);if($("dateFilter").value)q=q.eq("data_preferida",$("dateFilter").value);const {data,error}=await q;if(error){show("msg","Erro ao carregar: "+esc(error.message),"err");return}all=data||[];render()}
function render(){const term=$("search").value.toLowerCase();const list=all.filter(r=>[r.nome,r.telefone,r.bairro,r.endereco,r.servico].some(x=>String(x||"").toLowerCase().includes(term)));$("pending").textContent=all.filter(x=>x.status==="pendente").length;$("confirmed").textContent=all.filter(x=>x.status==="confirmado").length;$("done").textContent=all.filter(x=>x.status==="concluido").length;$("revenue").textContent=money(all.filter(x=>x.status==="concluido").reduce((s,x)=>s+Number(x.valor_total??x.valor_servico??0),0));
if(!list.length){$("rows").innerHTML='<tr><td colspan="7">Nenhum atendimento encontrado.</td></tr>';return}
$("rows").innerHTML=list.map(r=>{let actions=[];if(r.status==="pendente")actions.push(`<button class="btn" data-act="confirmado" data-id="${r.id}">Confirmar</button>`);if(["pendente","confirmado"].includes(r.status))actions.push(`<button class="btn red" data-act="cancelado" data-id="${r.id}">Cancelar</button>`);if(r.status==="confirmado")actions.push(`<button class="btn light" data-act="em_deslocamento" data-id="${r.id}">Em deslocamento</button>`);if(["confirmado","em_deslocamento"].includes(r.status))actions.push(`<button class="btn" data-act="concluido" data-id="${r.id}">Concluir</button>`); if (
  ["confirmado", "em_deslocamento", "concluido"].includes(r.status)
) {
  actions.push(
    `<button class="btn light" data-whatsapp="${r.id}">
      Enviar WhatsApp
    </button>`
  );
}
                                 
                                 
                                 return `<tr><td><b>${esc(r.nome)}</b><br>${esc(r.telefone)}<br>${esc(r.codigo_solicitacao)}</td><td>${esc(r.servico)}</td><td>${esc(r.data_confirmada||r.data_preferida)}<br>${esc(r.horario_confirmado||r.horario_preferido)}<br><small>${r.data_confirmada?"Confirmado":"Preferência"}</small></td><td>${esc([r.endereco,r.complemento,r.bairro,r.cep].filter(Boolean).join(", "))}</td><td>${money(r.valor_total??r.valor_servico)}</td><td>${esc(r.status)}</td><td><div class="row">${actions.join("")||"—"}</div></td></tr>`}).join("")}
  



$("rows").onclick = async e => {
  const w = e.target.closest("[data-whatsapp]");

  if (w) {
    const r = all.find(
      x => String(x.id) === String(w.dataset.whatsapp)
    );

    if (!r) {
      show("msg", "Atendimento não encontrado.", "err");
      return;
    }

    if (!r.tracking_token) {
      show("msg", "Solicitação sem token de acompanhamento.", "err");
      return;
    }

    const telefone = String(r.telefone || "").replace(/\D/g, "");

    if (!telefone) {
      show("msg", "Cliente sem telefone cadastrado.", "err");
      return;
    }

    const numero = telefone.startsWith("55")
      ? telefone
      : "55" + telefone;

    const link =
      "https://www.barbearialosvisionarios.com.br/acompanhar.html?token=" +
      encodeURIComponent(r.tracking_token);

    const mensagem =
      "Olá, " + (r.nome || "tudo bem") + "! 💈\n\n" +
      "Sua solicitação de atendimento domiciliar foi confirmada!\n\n" +
      "Acompanhe o status do atendimento pelo link:\n" +
      link + "\n\n" +
      "Obrigado por escolher a Barbearia Domiciliar Premium!";

    const url =
      "https://wa.me/" + numero +
      "?text=" + encodeURIComponent(mensagem);

    window.open(url, "_blank");
    return;
  }

  const b = e.target.closest("[data-act]");
  if (!b) return;


  const id = b.dataset.id;
  const act = b.dataset.act;
  const r = all.find(x => String(x.id) === String(id));

  if (!r) {
    show("msg", "Atendimento não encontrado.", "err");
    return;
  }

  let patch = {
    status: act,
    updated_at: new Date().toISOString()
  };

  if (act === "confirmado") {
    const d = prompt(
      "Data confirmada (AAAA-MM-DD):",
      r.data_preferida || ""
    );
    if (!d) return;

    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) {
      show("msg", "Data inválida. Use AAAA-MM-DD.", "err");
      return;
    }

    const h = prompt(
      "Horário confirmado (HH:MM):",
      r.horario_preferido || ""
    );
    if (!h) return;

    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(h)) {
      show("msg", "Horário inválido. Use HH:MM.", "err");
      return;
    }

    patch.data_confirmada = d;
    patch.horario_confirmado = h;
  }

  if (!confirm("Alterar status para " + act + "?")) return;

  const { error } = await db
    .from("agendamentos_domicilio")
    .update(patch)
    .eq("id", id);

  if (error) {
    show("msg", esc(error.message), "err");
    return;
  }

  show("msg", "Atendimento atualizado.", "ok");

  await load();

  if (act === "confirmado") {
    const { data: atualizado, error: erroBusca } = await db
      .from("agendamentos_domicilio")
      .select("tracking_token, telefone, nome, codigo_solicitacao")
      .eq("id", id)
      .maybeSingle();

    if (erroBusca) {
      show(
        "msg",
        "Atendimento confirmado, mas não foi possível obter o link: " +
          esc(erroBusca.message),
        "err"
      );
      return;
    }

    if (!atualizado?.tracking_token) {
      show(
        "msg",
        "Atendimento confirmado, mas está sem token de acompanhamento.",
        "err"
      );
      return;
    }

    const telefone = String(atualizado.telefone || "")
      .replace(/\D/g, "");

    if (!telefone) {
      show(
        "msg",
        "Atendimento confirmado. O telefone do cliente não foi encontrado.",
        "err"
      );
      return;
    }

    // Acrescenta o código do Brasil quando necessário.
    const numeroWhatsApp = telefone.startsWith("55")
      ? telefone
      : "55" + telefone;

    const link =
      "https://www.barbearialosvisionarios.com.br/acompanhar.html?token=" +
      encodeURIComponent(atualizado.tracking_token);

    const mensagem =
      "Olá, " + (atualizado.nome || "tudo bem") + "! 💈\n\n" +
      "Sua solicitação de atendimento domiciliar foi confirmada!\n\n" +
      "Acesse o link abaixo para acompanhar o status do atendimento:\n" +
      link + "\n\n" +
      "Obrigado por escolher a Barbearia Domiciliar Premium!";

    const whatsappURL =
      "https://wa.me/" + numeroWhatsApp +
      "?text=" + encodeURIComponent(mensagem);

    if (confirm("Atendimento confirmado! Deseja abrir o WhatsApp para enviar o link ao cliente?")) {
      window.open(whatsappURL, "_blank");
    }
  }
};



  
  $("refresh").onclick=load;$("statusFilter").onchange=load;$("dateFilter").onchange=load;$("search").oninput=render;check();
</script></body></html>
