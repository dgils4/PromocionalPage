<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pagamento da Inscrição</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;

}

.container{

    width:100%;
    max-width:420px;

    background:#111827;

    border-radius:15px;

    padding:25px;

    text-align:center;

    color:#FFF;

    box-shadow:0 10px 25px rgba(0,0,0,.35);

}

.logo{

    width:180px;

    height:180px;

    object-fit:cover;

    border-radius:50%;

    margin:auto;

    display:block;

}

h1{

    margin:20px 0 10px;

    color:#22c55e;

    font-size:24px;

}

p{

    color:#cbd5e1;

    margin-bottom:20px;

}

.qrcode{

    width:260px;

    max-width:100%;

    border-radius:12px;

    background:#FFF;

    padding:10px;

}

.valor{

    margin-top:20px;

    padding:15px;

    background:#1f2937;

    border-radius:10px;

}

.valor h2{

    color:#22c55e;

    margin-bottom:10px;

    font-size:18px;

}

.valor p{

    margin:0;

    font-size:28px;

    font-weight:bold;

    color:#FFF;

}

</style>

</head>

<body>

<div class="container">

<img
class="logo"
src="imagens/file_00000000b2f8720eb4a113e17c8e07b8.png"
alt="Logo Campeonato">

<h1>Pagamento da Inscrição</h1>

<p>
Escaneie o QR Code abaixo para realizar o pagamento da inscrição.
</p>

<img
class="qrcode"
src="COLE_AQUI_O_LINK_DO_QRCODE"
alt="QR Code PIX">

<div class="valor">

<h2>Valor da Inscrição</h2>

<p>R$ 25,00</p>

</div>

</div>

</body>

</html>
