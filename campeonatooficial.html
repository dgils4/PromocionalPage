    /* CAMPEÃO E PÓDIO DESTAQUE */

#campeao {

    border: 1px solid #334155; 
    padding: 20px; 
    border-radius: 20px;

    display: flex; 
    justify-content: center; 
    align-items: flex-end; 
    gap: 15px;

/* CARDS DE PRÊMIOS */
.premio { 
    flex: 1; 
    padding: 15px 10px; 
    border-radius: 15px; 
    text-align: center; 
    color: #000; 
    font-weight: bold; 
    transition: transform 0.3s ease;
}

/* 1º LUGAR - OURO */
.premio.ouro { 
    background: linear-gradient(135deg, #facc15, #ca8a04); 
    box-shadow: 0 0 20px rgba(250, 204, 21, 0.5); 
    transform: scale(1.08); 
    order: 2; /* Fica no meio */
}

/* 2º LUGAR - PRATA */
.premio.prata { 
    background: linear-gradient(135deg, #e2e8f0, #94a3b8); 
    box-shadow: 0 0 15px rgba(226, 232, 240, 0.3); 
    order: 1; /* Fica na esquerda */
}

/* 3º LUGAR - BRONZE */
.premio.bronze { 
    background: linear-gradient(135deg, #fdba74, #c2410c); 
    box-shadow: 0 0 15px rgba(253, 186, 116, 0.3); 
    order: 3; /* Fica na direita */
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }

        let participantes = [];
        let confrontos = [];

        // CARREGAR DADOS INICIAIS
        async function carregarDados() {
            document.getElementById("status").innerText = "Carregando...";
            
            const { data: partData } = await db.from('participantes').select('*');
            if (partData) participantes = partData;

            const { data: confData, error: confError } = await db.from('confrontos').select(`
                *,
                jogador1:participantes!confrontos_jogador1_id_fkey(*),
                jogador2:participantes!confrontos_jogador2_id_fkey(*),
                vencedor:participantes!confrontos_vencedor_id_fkey(*)
            `).order('id', { ascending: true });

            if (!confError && confData) {
                confrontos = confData;
            }

            document.getElementById("status").innerText = "Aberto";
            renderizarParticipantes();
            renderizarTodasFases();
            verificarCampeao();
        }

        carregarDados();

        // CONTROLES DE MENU E MODAL
        const btnMenu = document.getElementById("btnMenu");
        const menu = document.getElementById("menu");
        const overlay = document.getElementById("overlay");

        btnMenu.onclick = () => { menu.classList.add("ativo"); overlay.classList.add("ativo"); };
        overlay.onclick = fecharMenu;
        function fecharMenu() { menu.classList.remove("ativo"); overlay.classList.remove("ativo"); }

        const modalParticipantes = document.getElementById("modalParticipantes");
        document.getElementById("btnParticipantes").onclick = () => {
            modalParticipantes.classList.add("ativo");
            fecharMenu();
        };

        document.querySelectorAll(".fechar").forEach(botao => {
            botao.onclick = () => {
                modalParticipantes.classList.remove("ativo");
                document.getElementById("modalPartida").classList.remove("ativo");
            };
        });

        // ADICIONAR PARTICIPANTE NO SUPABASE
        document.getElementById("adicionarParticipante").onclick = async () => {
          if (!checarSenha()) return; // ⛔ Trava aqui!
            const nomeInput = document.getElementById("nomeParticipante");
            const nome = nomeInput.value.trim();
            const avatar = document.getElementById("avatar").value;

            if (!nome) return alert("Digite um nome");

            const { data, error } = await db.from('participantes').insert([{ nome, avatar }]).select();

            if (error) return alert("Erro: " + error.message);

            if (data) {
                participantes.push(data[0]);
                nomeInput.value = "";
                renderizarParticipantes();
            }
        };

        function renderizarParticipantes() {
            const lista = document.getElementById("listaParticipantes");
            lista.innerHTML = "";
            participantes.forEach(p => {
                lista.innerHTML += `
                    <div class="participante">
                        <span>${p.avatar} ${p.nome}</span>
                        <button onclick="removerParticipante(${p.id})">❌</button>
                    </div>
                `;
            });
        }

        // REMOVER PARTICIPANTE DO SUPABASE
        async function removerParticipante(id) {
          
if (!checarSenha()) return; // ⛔ Trava aqui!
          
            if (!confirm("Deseja realmente excluir este participante do banco de dados?")) return;

            const { error } = await db.from('participantes').delete().eq('id', id);
            
            if (error) {
                return alert("Erro ao excluir do banco de dados: " + error.message);
            }

            participantes = participantes.filter(p => p.id !== id);
            renderizarParticipantes();
        }

        // SORTEAR CAMPEONATO
        document.getElementById("btnSortear").onclick = sortearCampeonato;

     async function sortearCampeonato() {
       if (!checarSenha()) return; // ⛔ Trava aqui!
     const total = participantes.length;

    // ⛔ 1. Bloqueia se tiver menos de 2 participantes
    if (total < 2) {
        return alert("Adicione pelo menos 2 participantes para iniciar!");
    }

    // ⛔ 2. Bloqueia especificamente 3, 5 e 6 participantes
    const quantidadesProibidas = [3, 5, 6 , 7];
    if (quantidadesProibidas.includes(total)) {
        return alert(`Não é possível realizar o sorteio com ${total} participantes. Por favor, adicione ou remova jogadores.`);
    }

    // Apaga confrontos anteriores
    await db.from('confrontos').delete().neq('id', 0);

    const lista = [...participantes].sort(() => Math.random() - 0.5);
    let novosConfrontos = [];

    // SE HOUVER MAIS DE 8 PARTICIPANTES (8, 9, 10, 11, 12...)
    if (lista.length > 8) {
        // Reservamos 7 para irem direto para as Quartas
        const diretosQuartas = lista.slice(0, 7);
        // O restante entra na Eliminatória Escada
        const participantesElim = lista.slice(7);

        // 1. CRIAR OS JOGOS DA ELIMINATÓRIA (ESCADA)
        // O 1º jogo é P0 vs P1
        novosConfrontos.push({
            fase: "Eliminatória",
            jogador1_id: participantesElim[0].id,
            jogador2_id: participantesElim[1].id,
            vitorias_jogador1: 0, vitorias_jogador2: 0, status: 'Pendente'
        });

        // Os próximos jogos colocam o vencedor anterior contra o próximo da fila (P2, P3, P4...)
        for (let i = 2; i < participantesElim.length; i++) {
            novosConfrontos.push({
                fase: "Eliminatória",
                jogador1_id: null, // Será preenchido pelo vencedor do jogo anterior
                jogador2_id: participantesElim[i].id,
                vitorias_jogador1: 0, vitorias_jogador2: 0, status: 'Pendente'
            });
        }

        // 2. CRIAR AS QUARTAS DE FINAL (7 preenchidos + 1 vaga 'Aguardando' o sobrevivente)
        novosConfrontos.push(
            { fase: "Quartas", jogador1_id: diretosQuartas[0].id, jogador2_id: null, vitorias_jogador1: 0, vitorias_jogador2: 0, status: 'Pendente' },
            { fase: "Quartas", jogador1_id: diretosQuartas[1].id, jogador2_id: diretosQuartas[2].id, vitorias_jogador1: 0, vitorias_jogador2: 0, status: 'Pendente' },
            { fase: "Quartas", jogador1_id: diretosQuartas[3].id, jogador2_id: diretosQuartas[4].id, vitorias_jogador1: 0, vitorias_jogador2: 0, status: 'Pendente' },
            { fase: "Quartas", jogador1_id: diretosQuartas[5].id, jogador2_id: diretosQuartas[6].id, vitorias_jogador1: 0, vitorias_jogador2: 0, status: 'Pendente' }
        );

        // 3. SEMIFINAIS E FINAL
        for (let i = 0; i < 2; i++) novosConfrontos.push({ fase: "Semifinal", jogador1_id: null, jogador2_id: null, vitorias_jogador1: 0, vitorias_jogador2: 0, status: 'Pendente' });
        novosConfrontos.push({ fase: "Final", jogador1_id: null, jogador2_id: null, vitorias_jogador1: 0, vitorias_jogador2: 0, status: 'Pendente' });

    } else {
        // REGRA PADRÃO PARA 8 OU MENOS PARTICIPANTES
        const estrutura = criarEstrutura(lista.length);
        estrutura.forEach(fase => {
            for (let i = 1; i <= fase.jogos; i++) {
                novosConfrontos.push({
                    fase: fase.nome, jogador1_id: null, jogador2_id: null,
                    vencedor_id: null, vitorias_jogador1: 0, vitorias_jogador2: 0, status: 'Pendente'
                });
            }
        });

        const primeiraFase = novosConfrontos.filter(c => c.fase === estrutura[0].nome);
        lista.forEach((p, i) => {
            let jogo = primeiraFase[Math.floor(i / 2)];
            if (i % 2 === 0) jogo.jogador1_id = p.id;
            else jogo.jogador2_id = p.id;
        });
    }

    const { error } = await db.from('confrontos').insert(novosConfrontos);
    if (error) return alert("Erro ao sortear: " + error.message);

    await carregarDados();
    fecharMenu();
}


        function criarEstrutura(total) {
            let fases = [];
            if (total <= 2) fases.push({ nome: "Final", jogos: 1 });
            else if (total <= 4) { fases.push({ nome: "Semifinal", jogos: 2 }); fases.push({ nome: "Final", jogos: 1 }); }
            else { fases.push({ nome: "Quartas", jogos: 4 }); fases.push({ nome: "Semifinal", jogos: 2 }); fases.push({ nome: "Final", jogos: 1 }); }
            return fases;
        }

        // RENDERIZAR CARD DOS JOGOS
        function renderizarFase(lista, fase) {
            let id = fase.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "");
            const container = document.getElementById(id);
            if (!container) return;
            container.innerHTML = "";

            lista.forEach(jogo => {
                const j1 = jogo.jogador1;
                const j2 = jogo.jogador2;
                const vencedorId = jogo.vencedor_id;

                let classeJ1 = !j1 ? "aguardando" : (vencedorId ? (vencedorId === j1.id ? "vencedor" : "perdedor") : "");
                let classeJ2 = !j2 ? "aguardando" : (vencedorId ? (vencedorId === j2.id ? "vencedor" : "perdedor") : "");

                container.innerHTML += `
                    <div class="confronto" onclick="abrirConfronto('${jogo.id}')">
                        <div class="jogador ${classeJ1}">
                            <span>
                                <span class="avatar">${j1 ? j1.avatar : "⏳"}</span> 
                                ${j1 ? j1.nome : "Aguardando"}
                            </span>
                            <strong>${jogo.vitorias_jogador1 || 0}</strong>
                        </div>
                        <div class="placar">VS</div>
                        <div class="jogador ${classeJ2}">
                            <span>
                                <span class="avatar">${j2 ? j2.avatar : "⏳"}</span> 
                                ${j2 ? j2.nome : "Aguardando"}
                            </span>
                            <strong>${jogo.vitorias_jogador2 || 0}</strong>
                        </div>
                        <div class="statusJogo">
                            ${jogo.vencedor ? "🏆 " + jogo.vencedor.nome : jogo.fase}
                        </div>
                    </div>
                `;
            });
        }

        let confrontoSelecionado = null;

        function abrirConfronto(id) {
          // 1. Bloqueio ao abrir confronto/alterar placar

    if (!checarSenha()) return; // ⛔ Trava aqui!
          
          
            confrontoSelecionado = confrontos.find(c => c.id == id);
            if (!confrontoSelecionado || !confrontoSelecionado.jogador1 || !confrontoSelecionado.jogador2) {
                return alert("Este confronto aguarda a definição de ambos os jogadores!");
            }

            document.getElementById("dadosPartida").innerHTML = `
                <h3>
                    ${confrontoSelecionado.jogador1.avatar} ${confrontoSelecionado.jogador1.nome} 
                    <br> ${confrontoSelecionado.vitorias_jogador1} x ${confrontoSelecionado.vitorias_jogador2} <br>
                    ${confrontoSelecionado.jogador2.avatar} ${confrontoSelecionado.jogador2.nome}
                </h3>
            `;

            if (confrontoSelecionado.vencedor) {
                document.getElementById("opcoesVencedor").innerHTML = `
                    <h3>🏆 Vencedor: ${confrontoSelecionado.vencedor.nome}</h3>
                `;
            } else {
                document.getElementById("opcoesVencedor").innerHTML = `
                    <button onclick="registrarVitoria(1)">🏆 Vitória de ${confrontoSelecionado.jogador1.nome}</button>
                    <button onclick="registrarVitoria(2)">🏆 Vitória de ${confrontoSelecionado.jogador2.nome}</button>
                `;
            }

            document.getElementById("modalPartida").classList.add("ativo");
        }

     async function registrarVitoria(numJogador) {
    let v1 = confrontoSelecionado.vitorias_jogador1;
    let v2 = confrontoSelecionado.vitorias_jogador2;

    if (numJogador === 1) v1++;
    else v2++;

    let vencedorId = null;
    let status = 'Em Andamento';

    if (v1 === 2) {
        vencedorId = confrontoSelecionado.jogador1.id;
        status = 'Finalizado';
    } else if (v2 === 2) {
        vencedorId = confrontoSelecionado.jogador2.id;
        status = 'Finalizado';
    }

    const { error } = await db.from('confrontos').update({
        vitorias_jogador1: v1,
        vitorias_jogador2: v2,
        vencedor_id: vencedorId,
        status: status
    }).eq('id', confrontoSelecionado.id);

    if (error) return alert("Erro ao atualizar confronto: " + error.message);

    // 🟢 MUDANÇA AQUI: Passamos o confrontoSelecionado inteiro!
    if (vencedorId) {
        await promoverVencedor(confrontoSelecionado, vencedorId);
    }

    await carregarDados();
    document.getElementById("modalPartida").classList.remove("ativo");
}


        // LÓGICA DE PROMOÇÃO DE VENCEDORES
     async function promoverVencedor(confrontoAtual, vencedorId) {
    const ordemFases = ["Eliminatória", "Quartas", "Semifinal", "Final"];

    // ==========================================
    // LÓGICA ESPECIAL PARA A ELIMINATÓRIA
    // ==========================================
    if (confrontoAtual.fase === "Eliminatória") {
        // Buscar todos os jogos da eliminatória ordenados por ID
        const { data: jogosElim } = await db.from('confrontos')
            .select('*')
            .eq('fase', 'Eliminatória')
            .order('id', { ascending: true });

        // Achar a posição (índice) do jogo que acabou de ser concluído
        const indexAtual = jogosElim.findIndex(j => j.id === confrontoAtual.id);

        // Se houver um PRÓXIMO jogo na eliminatória (ex: Jogo 2 onde o Manda está)
        if (indexAtual !== -1 && indexAtual + 1 < jogosElim.length) {
            const proximoJogoElim = jogosElim[indexAtual + 1];

            // Injeta o Tiago na vaga 'jogador1_id' que estava "Aguardando"
            const { error } = await db.from('confrontos')
                .update({ jogador1_id: vencedorId })
                .eq('id', proximoJogoElim.id);

            if (error) console.error("Erro ao mover para o próximo jogo:", error);
            return;
        }

        // Se já era o ÚLTIMO jogo da eliminatória, manda o vencedor para as Quartas
        const { data: jogosQuartas } = await db.from('confrontos')
            .select('*')
            .eq('fase', 'Quartas')
            .order('id', { ascending: true });

        const jogoQuartasVago = jogosQuartas.find(c => !c.jogador1_id || !c.jogador2_id);
        if (jogoQuartasVago) {
            let campoUpdate = !jogoQuartasVago.jogador1_id ? { jogador1_id: vencedorId } : { jogador2_id: vencedorId };
            await db.from('confrontos').update(campoUpdate).eq('id', jogoQuartasVago.id);
        }
        return;
    }

    // ==========================================
    // LÓGICA PADRÃO PARA QUARTAS, SEMIFINAL E FINAL
    // ==========================================
    const indexFaseAtual = ordemFases.indexOf(confrontoAtual.fase);
    if (indexFaseAtual === -1 || indexFaseAtual === ordemFases.length - 1) return;

    const proximaFase = ordemFases[indexFaseAtual + 1];

    const { data: proximosJogos } = await db.from('confrontos')
        .select('*')
        .eq('fase', proximaFase)
        .order('id', { ascending: true });

    if (!proximosJogos || proximosJogos.length === 0) return;

    for (let jogo of proximosJogos) {
        if (!jogo.jogador1_id) {
            await db.from('confrontos').update({ jogador1_id: vencedorId }).eq('id', jogo.id);
            break;
        } else if (!jogo.jogador2_id) {
            await db.from('confrontos').update({ jogador2_id: vencedorId }).eq('id', jogo.id);
            break;
        }
    }
}


       async function verificarCampeao() {
    const jogoFinal = confrontos.find(c => c.fase === "Final");
    const secao = document.getElementById("secaoCampeao");
    const container = document.getElementById("campeao");

    if (jogoFinal && jogoFinal.vencedor) {
        // 1. Campeão (Ouro)
        const campeao = jogoFinal.vencedor;

        // 2. Vice-Campeão (Prata - quem perdeu a final)
        const vice = jogoFinal.jogador1_id === campeao.id ? jogoFinal.jogador2 : jogoFinal.jogador1;

        // 3. 3º Lugar (Bronze - buscar perdedores das semifinais)
        const jogosSemi = confrontos.filter(c => c.fase === "Semifinal" && c.vencedor_id);
        let terceiro = null;

        if (jogosSemi.length > 0) {
            // Pega o perdedor da 1ª semifinal como referência para o 3º lugar
            const perdedorSemi1 = jogosSemi[0].jogador1_id === jogosSemi[0].vencedor_id ? jogosSemi[0].jogador2 : jogosSemi[0].jogador1;
            terceiro = perdedorSemi1;
        }

        // Renderiza o Pódio com Ouro, Prata e Bronze
        container.innerHTML = `
            <div class="podio-container">
                <!-- 2º LUGAR (PRATA) -->
                ${vice ? `
                <div class="premio prata">
                    <div class="trofeu">🥈</div>
                    <div class="avatar-podio">${vice.avatar}</div>
                    <div class="nome-podio">${vice.nome}</div>
                    <small>2º Lugar</small>
                </div>
                ` : ''}

                <!-- 1º LUGAR (OURO) -->
                <div class="premio ouro">
                    <div class="trofeu">🏆</div>
                    <div class="avatar-podio">${campeao.avatar}</div>
                    <div class="nome-podio">${campeao.nome}</div>
                    <small>1º Lugar (Campeão)</small>
                </div>

                <!-- 3º LUGAR (BRONZE) -->
                ${terceiro ? `
                <div class="premio bronze">
                    <div class="trofeu">🥉</div>
                    <div class="avatar-podio">${terceiro.avatar}</div>
                    <div class="nome-podio">${terceiro.nome}</div>
                    <small>3º Lugar</small>
                </div>
                ` : ''}
            </div>
        `;

        secao.classList.add("ativo");

        // 📜 SCROLL SUAVE PARA O TOPO DA TELA
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });

    } else {
        secao.classList.remove("ativo");
    }
}


        function renderizarTodasFases() {
            ["Eliminatória", "Quartas", "Semifinal", "Final"].forEach(f => {
                const jogos = confrontos.filter(c => c.fase === f);
                renderizarFase(jogos, f);
            });
        }

        async function resetarCampeonato() {
          if (!checarSenha()) return; // ⛔ Trava aqui!
            if (confirm("Tem certeza que deseja reiniciar o campeonato inteiro?")) {
                await db.from('confrontos').delete().neq('id', 0);
                await carregarDados();
                fecharMenu();
            }
        }
    </script>
